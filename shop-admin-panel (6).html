function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${parseInt(m)}/${parseInt(d)}/${y}`;
}
function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function slug(s) {
  return String(s || '').trim().replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function detailValue(details, key) {
  return (details && details[key] && details[key][0]) || '';
}
function splitSelfContrast(value) {
  const m = String(value || '').match(/^(Self|Contrast)\s*-\s*(.*)$/);
  if (!m) return { self: '', contrast: '' };
  return m[1] === 'Self' ? { self: m[2], contrast: '' } : { self: '', contrast: m[2] };
}

function softTint(hex, amount) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  const mix = (c) => Math.round(c + (255 - c) * amount);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function swatchStyle(pattern, c1, c2) {
  const bg = softTint(c2, 0.55);
  const line = softTint(c1, 0.15);
  switch (pattern) {
    case 'stripe': return { backgroundImage: `linear-gradient(140deg, ${bg} 0%, ${bg} 55%, ${softTint(c1, 0.35)} 55%, ${softTint(c1, 0.35)} 100%)` };
    case 'check': return { backgroundColor: bg, backgroundImage: `repeating-linear-gradient(0deg, ${line}55 0px, ${line}55 1.5px, transparent 1.5px, transparent 34px), repeating-linear-gradient(90deg, ${line}55 0px, ${line}55 1.5px, transparent 1.5px, transparent 34px)` };
    case 'dot': return { backgroundColor: bg, backgroundImage: `radial-gradient(${line} 2.5px, transparent 3px)`, backgroundSize: '28px 28px' };
    case 'mix': return { backgroundImage: `linear-gradient(150deg, ${softTint(c1, 0.4)} 0%, ${softTint(c1, 0.4)} 50%, ${softTint(c2, 0.4)} 50%, ${softTint(c2, 0.4)} 100%)` };
    default: return { backgroundColor: bg };
  }
}

                              <button type="button" onClick={() => editGalleryFileRef.current?.click()} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: COLORS.paper }}><ImageIcon size={14} /> Gallery</button>

                          </div>
                          <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: `${COLORS.ink}77` }}>Tap to change</p>

                              const val = (categoryValues[label] || [])[0];
                              return (
                                <button key={label} type="button" onClick={() => openCategorySheet(label)} className="px-2 py-2 rounded-lg text-xs font-medium truncate"

                                  {val || label}
                                </button>

                            })}

                        </div>
                      </>
                    ) : (
                      <>
                        {serial.photo ? (
                          <button className="w-full" onClick={() => { setZoomPhoto(serial.photo); setZoomedIn(false); }}>

                            <Row label="Discount %" value={`${line.discountPercent || 0}%`} />
                          </div>

      {/* Photo zoom lightbox */}

          <img
            src={zoomPhoto} alt="" onClick={(e) => { e.stopPropagation(); setZoomedIn((z) => !z); }}

          />
        </div>
      )}

      {/* Expand Bill Lines modal */}
      {expandLinesOpen && viewingReceipt && (

                  <tr style={{ backgroundColor: `${COLORS.ink}0D` }}>

                  </tr>

                    <tr key={r.id} style={{ borderTop: `1px solid ${COLORS.border}` }}>
                      <td className="px-3 py-2 sp-mono">{r.slno}</td>
                      <td className="px-3 py-2">{r.articleCode || '—'}</td>
                      <td className="px-3 py-2 whitespace-nowrap">{r.articleName || '—'}</td>
                      <td className="px-3 py-2 whitespace-nowrap">{r.itemName || '—'}</td>
                      <td className="px-3 py-2 sp-mono">{r.qty}</td>
                      <td className="px-3 py-2 sp-mono">{r.purRate}</td>
                      <td className="px-3 py-2 sp-mono">{r.discountPercent}%</td>
                      <td className="px-3 py-2 sp-mono">{r.scheme || '—'}</td>
                      <td className="px-3 py-2 sp-mono">{r.mrp || '—'}</td>
                      <td className="px-3 py-2 sp-mono">{r.salePrice || '—'}</td>
                      <td className="px-3 py-2 sp-mono font-semibold">₹{r.lineValue.toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>

                  onClick={() => {
                    if (subSheetOpen === 'Review') { finalizeSerialGroup(); return; }
                    if (!CATEGORY_OPTIONS[subSheetOpen]) setCategoryValues((prev) => ({ ...prev, [subSheetOpen]: subSheetInputs }));
                    if (serialEditMode) { setSubSheetOpen(null); return; }
                    advanceOrClose(subSheetOpen);

                  className="px-4 py-1.5 rounded-lg text-sm font-semibold"

                    return (
                      <div key={label} className="flex items-center justify-between px-3 py-2.5 rounded-lg" style={{ border: `1px solid ${ok ? COLORS.border : COLORS.red}` }}>
                        <div>
                          <p className="text-xs" style={{ color: `${COLORS.ink}88` }}>{label}</p>
                          <p className="text-sm font-medium" style={{ color: ok ? COLORS.ink : COLORS.red }}>{val || 'Not entered'}</p>
                        </div>
                        {ok ? <Check size={18} color={COLORS.green} /> : <AlertCircle size={18} color={COLORS.red} />}
                      </div>
                    );
                  })}
                  <div className="flex items-center justify-between px-3 py-2.5 rounded-lg" style={{ border: `1px solid ${COLORS.border}` }}>
                    <div className="flex-1">
                      <p className="text-xs mb-1" style={{ color: `${COLORS.ink}88` }}>Qty</p>
                      <input
                        value={(categoryValues['Qty'] || [])[0] || ''}
                        onChange={(e) => setCategoryValues((prev) => ({ ...prev, Qty: [e.target.value] }))}
                        type="number" min="0" placeholder="Enter qty"
                        className="text-sm font-medium bg-transparent w-full sp-mono"
                      />
                    </div>
                  </div>
                  <div className="px-3 py-2.5 rounded-lg" style={{ border: `1px solid ${COLORS.border}` }}>
                    <p className="text-xs mb-1.5" style={{ color: `${COLORS.ink}88` }}>Photo</p>

                      ref={photoFileRef} type="file" accept="image/*" capture="environment" className="hidden"

                        const file = e.target.files && e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = () => setCategoryValues((prev) => ({ ...prev, Photo: [reader.result] }));
                        reader.readAsDataURL(file);
                        setPhotoMenuOpen(false);
                      }}
                    />
                    <input
                      ref={galleryFileRef} type="file" accept="image/*" className="hidden"
                      onChange={(e) => {
                        const file = e.target.files && e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = () => setCategoryValues((prev) => ({ ...prev, Photo: [reader.result] }));
                        reader.readAsDataURL(file);
                        setPhotoMenuOpen(false);
                      }}
                    />
                    <button type="button" onClick={() => setPhotoMenuOpen((v) => !v)} className="flex items-center gap-2">
                      {(categoryValues['Photo'] || [])[0] ? (
                        <img src={categoryValues['Photo'][0]} alt="Item" className="w-12 h-12 rounded object-cover" style={{ border: `1px solid ${COLORS.border}` }} />
                      ) : (
                        <span className="w-12 h-12 rounded flex items-center justify-center" style={{ border: `1px dashed ${COLORS.border}` }}><Camera size={16} color={`${COLORS.ink}66`} /></span>
                      )}
                      <span className="text-xs font-semibold" style={{ color: COLORS.accent }}>{(categoryValues['Photo'] || [])[0] ? 'Change photo' : 'Take photo'}</span>
                    </button>
                    {photoMenuOpen && (
                      <div className="flex gap-2 mt-3">
                        <button type="button" onClick={() => photoFileRef.current?.click()} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: COLORS.paper, color: COLORS.ink }}>
                          <Camera size={14} /> Camera
                        </button>
                        <button type="button" onClick={() => galleryFileRef.current?.click()} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: COLORS.paper, color: COLORS.ink }}>
                          <ImageIcon size={14} /> Gallery
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              ) : CATEGORY_OPTIONS[subSheetOpen] ? (
                <>
                  <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(CATEGORY_OPTIONS[subSheetOpen].length, 6)}, 1fr)` }}>

                      const isSwatch = typeof opt === 'object';
                      const label = isSwatch ? opt.label : opt;
                      const isTwoLevel = CATEGORY_TWO_LEVEL.includes(subSheetOpen);
                      const selected = isTwoLevel ? subLevel1 === label : (categoryValues[subSheetOpen] || [])[0] === label;
                      return (
                        <button
                          key={label}
                          type="button"
                          onClick={() => (isTwoLevel ? setSubLevel1(label) : selectOption(subSheetOpen, label))}
                          className="rounded-lg overflow-hidden text-center"
                          style={{ border: `1.5px solid ${selected ? COLORS.accent : COLORS.border}`, backgroundColor: selected ? COLORS.active : COLORS.white }}
                        >
                          {isSwatch ? (
                            <>
                              <div className="h-9 w-full flex">
                                {opt.colors.map((c, i) => (
                                  <div key={i} style={{ backgroundColor: c, flex: 1, borderRight: opt.colors.length > 1 && i === 0 ? `1px solid ${COLORS.border}` : 'none' }} />
                                ))}
                              </div>
                              <p className="text-[10px] leading-tight px-1 py-1" style={{ color: selected ? COLORS.activeText : COLORS.ink }}>{label}</p>
                            </>
                          ) : (
                            <p className="text-xs font-medium px-2 py-2" style={{ color: selected ? COLORS.activeText : COLORS.ink }}>{label}</p>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {CATEGORY_TWO_LEVEL.includes(subSheetOpen) && subLevel1 && (
                    <div className="mt-4 pt-4" style={{ borderTop: `1px dashed ${COLORS.border}` }}>
                      <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: `${COLORS.ink}77` }}>{subLevel1} — choose design</p>
                      <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(CATEGORY_SUBOPTIONS[subSheetOpen].length, 4)}, 1fr)` }}>
                        {CATEGORY_SUBOPTIONS[subSheetOpen].map((d) => {
                          const combined = `${subLevel1} - ${d}`;
                          const selected = (categoryValues[subSheetOpen] || [])[0] === combined;
                          return (
                            <button
                              key={d}
                              type="button"
                              onClick={() => selectOption(subSheetOpen, combined)}
                              className="px-2 py-2 rounded-lg text-xs font-medium text-center"
                              style={{ border: `1.5px solid ${selected ? COLORS.accent : COLORS.border}`, backgroundColor: selected ? COLORS.active : COLORS.white, color: selected ? COLORS.activeText : COLORS.ink }}
                            >
                              {d}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </>
              ) : (
                <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(subSheetInputs.length, 6)}, 1fr)` }}>
                  {subSheetInputs.map((val, i) => (
                    <input
                      key={i}
                      autoFocus={i === 0}
                      value={val}
                      onChange={(e) => setSubSheetInputs((prev) => prev.map((v, idx) => (idx === i ? e.target.value : v)))}
                      className="px-2 py-2 rounded-lg text-sm sp-mono text-center w-full"
                      style={inputStyle}
                    />
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>

      {addPurchaserOpen && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ backgroundColor: 'rgba(0,0,0,0.4)' }} onClick={() => setAddPurchaserOpen(false)}>

              <h3 className="text-lg font-bold">Add Purchaser</h3>
              <button onClick={() => setAddPurchaserOpen(false)} aria-label="Close"><X size={20} /></button>
            </div>
            <input
              autoFocus value={newPurchaserName} onChange={(e) => setNewPurchaserName(e.target.value)}
              placeholder="Purchaser name" onKeyDown={(e) => e.key === 'Enter' && addPurchaser()}

            <button onClick={addPurchaser} className="w-full py-3 rounded-full font-semibold text-sm" style={{ backgroundColor: COLORS.accent, color: COLORS.white }}>
              Save
            </button>
          </div>
        </div>

        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ backgroundColor: 'rgba(0,0,0,0.4)' }} onClick={() => setAddArticleOpen(false)}>

            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold">Add Article</h3>
              <button onClick={() => setAddArticleOpen(false)} aria-label="Close"><X size={20} /></button>

              autoFocus value={newArticleCode} onChange={(e) => setNewArticleCode(e.target.value)}

              className="w-full px-3 py-2 rounded-lg text-sm mb-3" style={{ border: `1px solid ${COLORS.border}` }}

            <input
              value={newArticleName} onChange={(e) => setNewArticleName(e.target.value)}
              placeholder="Article name"
              className="w-full px-3 py-2 rounded-lg text-sm mb-3" style={{ border: `1px solid ${COLORS.border}` }}

              value={newItemName} onChange={(e) => setNewItemName(e.target.value)}
              placeholder="Item name" onKeyDown={(e) => e.key === 'Enter' && addArticle()}

            />
            <button onClick={addArticle} className="w-full py-3 rounded-full font-semibold text-sm" style={{ backgroundColor: COLORS.accent, color: COLORS.white }}>
              Save
            </button>
          </div>

      {/* Blank serial entry sheet — full plain panel, matches other forms */}
      {serialSheetOpen && (
        <div className="fixed inset-0 z-50 flex justify-end" style={{ backgroundColor: 'rgba(0,0,0,0.35)' }}>

            <div className="sticky top-0 flex items-center justify-between px-5 py-4 z-10" style={{ backgroundColor: COLORS.white, borderBottom: `1px solid ${COLORS.border}` }}>
              <div className="flex items-center gap-2">
                <button onClick={() => setSerialSheetOpen(false)} aria-label="Close"><X size={20} /></button>
                <span className="font-semibold">Add Serial</span>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setSerialSheetOpen(false)} className="px-4 py-1.5 rounded-lg text-sm font-semibold" style={{ border: `1px solid ${COLORS.accent}`, color: COLORS.accent }}>Cancel</button>
                <button
                  onClick={finalizeSerialGroup}
                  className="px-4 py-1.5 rounded-lg text-sm font-semibold"
                  style={{ backgroundColor: COLORS.accent, color: COLORS.white }}

                  Save
                </button>
              </div>
            </div>
            <div className="p-5">
              <div className="flex flex-nowrap gap-2">
                {CATEGORY_LABELS.map((label) => {
                  const filled = (categoryValues[label] || []).some((v) => v);
                  return (
                    <button
                      key={label}
                      type="button"
                      onClick={() => openCategorySheet(label)}
                      className="px-2 py-2 rounded-lg text-xs font-medium flex-1 min-w-0 w-0 truncate"
                      style={{ ...inputStyle, color: filled ? COLORS.ink : `${COLORS.ink}77`, borderColor: filled ? COLORS.accent : COLORS.border }}
                      title={label}

                      {label}
                    </button>

              </div>
            </div>
          </div>
        </div>

      {/* Add New Line — MasterData New Form */}
      {lineOpen && (
        <div className="fixed inset-0 z-40 flex justify-end" style={{ backgroundColor: 'rgba(0,0,0,0.35)' }}>
          <div className="w-full sm:w-[520px] h-full overflow-y-auto" style={{ backgroundColor: COLORS.white }}>
            <div className="sticky top-0 flex items-center justify-between px-5 py-4 z-10" style={{ backgroundColor: COLORS.white, borderBottom: `1px solid ${COLORS.border}` }}>
              <div className="flex items-center gap-3"><button onClick={() => { setLineOpen(false); setEditingLineId(null); }} aria-label="Close"><X size={20} /></button><span className="font-semibold">MasterData New Form</span></div>
              <div className="flex items-center gap-2">
                <button onClick={() => { setLineOpen(false); setEditingLineId(null); }} className="px-4 py-1.5 rounded-lg text-sm font-semibold" style={{ border: `1px solid ${COLORS.accent}`, color: COLORS.accent }}>Cancel</button>

              </Field>
              <Field label="PUR RATE" required>
                <input value={lineForm.purRate} onChange={(e) => setLineForm((f) => ({ ...f, purRate: e.target.value }))} placeholder="0.00" type="number" min="0" className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle} />
              </Field>
              <Field label="Discount %">
                <div className="flex items-center px-3 rounded-lg" style={inputStyle}>
                  <span className="text-sm" style={{ color: `${COLORS.ink}88` }}>%</span>
                  <input value={lineForm.discountPercent} onChange={(e) => setLineForm((f) => ({ ...f, discountPercent: e.target.value }))} type="number" min="0" max="100" className="flex-1 px-2 py-2 text-sm sp-mono bg-transparent" />
                </div>
              </Field>
              {parseFloat(lineForm.purRate) > 0 && (
                <Field label="1+1">
                  <div className="flex items-center gap-2">
                    <div className="flex-1">
                      <SearchableSelect
                        value={lineForm.scheme}
                        onChange={(v) => setLineForm((f) => ({ ...f, scheme: v, mrp: '', salePrice: '' }))}
                        options={SCHEME_OPTIONS}
                      />
                    </div>
                    {lineForm.scheme && (
                      <button type="button" onClick={() => setLineForm((f) => ({ ...f, scheme: '', mrp: '', salePrice: '' }))} aria-label="Clear">
                        <X size={14} color={`${COLORS.ink}88`} />
                      </button>
                    )}
                  </div>
                </Field>
              )}
              {lineForm.scheme && (
                <>
                  <Field label="Effective_MRP">
                    <Stepper
                      value={parseFloat(lineForm.mrp) || 0}
                      onChange={(v) => {
                        const divisor = SCHEME_DIVISOR[lineForm.scheme];
                        setLineForm((f) => ({ ...f, mrp: String(v), salePrice: divisor ? (v / divisor).toFixed(2) : f.salePrice }));
                      }}
                      step={1}
                      disabled={!SCHEME_DIVISOR[lineForm.scheme]}
                    />
                  </Field>
                  <Field label="SALE RATE">
                    {SCHEME_DIVISOR[lineForm.scheme] ? (
                      <input value={lineForm.salePrice} readOnly placeholder="0.00" className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={{ ...inputStyle, backgroundColor: COLORS.paper, color: `${COLORS.ink}77` }} />
                    ) : (
                      <input
                        value={lineForm.salePrice}
                        onChange={(e) => {
                          const v = e.target.value;
                          const raw = v ? parseFloat(v) / 0.7 : 0;
                          const mrp = v ? String(Math.round(raw / 10) * 10) : '';
                          setLineForm((f) => ({ ...f, salePrice: v, mrp }));
                        }}
                        placeholder="0.00" type="number" min="0"
                        className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle}
                      />
                    )}
                  </Field>
                  <Field label={`Serials-Total Qty : ${lineForm.serials.reduce((s, r) => s + (r.qty || 0), 0)}`}>
                    <div>
                      {lineForm.serials.length > 0 && (
                        <div className="rounded-lg overflow-hidden mb-2" style={{ border: `1px solid ${COLORS.border}` }}>
                          <div className="grid grid-cols-3 text-xs font-semibold px-3 py-1.5" style={{ backgroundColor: `${COLORS.ink}0D`, color: `${COLORS.ink}88` }}>
                            <span>SLNO</span><span className="text-center">Image</span><span className="text-right">QTY</span>
                          </div>
                          {lineForm.serials.map((r) => (
                            <div key={r.id} className="grid grid-cols-3 items-center px-3 py-2 text-sm" style={{ borderTop: `1px solid ${COLORS.border}` }}>
                              <span className="sp-mono">{r.slno}</span>
                              <span className="flex justify-center">{r.photo ? <button type="button" onClick={() => { setZoomPhoto(r.photo); setZoomedIn(false); }}><img src={r.photo} alt="" className="w-6 h-6 rounded object-cover" /></button> : <Download size={14} color={`${COLORS.ink}66`} />}</span>
                              <span className="sp-mono text-right">{r.qty}</span>
                            </div>
                          ))}
                        </div>
                      )}
                      <button
                        type="button"
                        onClick={() => setSerialSheetOpen(true)}
                        className="w-full py-2 rounded-lg text-sm font-semibold text-center"
                        style={{ backgroundColor: COLORS.paper, color: COLORS.accent }}
                      >
                        Add New
                      </button>
                    </div>
                  </Field>
                </>
              )}
              <Field label="SERIAL NO">
                <input value={lineForm.serialNo} onChange={(e) => setLineForm((f) => ({ ...f, serialNo: e.target.value }))} className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle} />
              </Field>
              <div className="flex items-center gap-1.5 text-sm -mt-2" style={{ color: COLORS.red }}>
                <AlertCircle size={14} /> Check Sub serials are entered
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Hidden file input reused for photo view/upload from detail screen */}
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={(e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !viewingId) return;
        const reader = new FileReader();
        reader.onload = () => setSavedReceipts((prev) => prev.map((r) => r.id === viewingId ? { ...r, photo: reader.result, photoFileName: file.name } : r));
        reader.readAsDataURL(file);
      }} />

      {/* ADD / EDIT PANEL */}
      {addOpen && (
        <div className="fixed inset-0 z-40 flex justify-end" style={{ backgroundColor: 'rgba(0,0,0,0.35)' }}>
          <div className="w-full sm:w-[520px] h-full overflow-y-auto" style={{ backgroundColor: COLORS.white }}>
            <div className="sticky top-0 flex items-center justify-between px-5 py-4 z-10" style={{ backgroundColor: COLORS.white, borderBottom: `1px solid ${COLORS.border}` }}>
              <div className="flex items-center gap-3"><button onClick={() => setAddOpen(false)} aria-label="Close"><X size={20} /></button><span className="font-semibold">ReceiptHeaderCompletedForm</span></div>
              <div className="flex items-center gap-2">
                <button onClick={() => setAddOpen(false)} className="px-4 py-1.5 rounded-lg text-sm font-semibold" style={{ border: `1px solid ${COLORS.accent}`, color: COLORS.accent }}>Cancel</button>
                <button onClick={saveReceipt} disabled={!canSave} className="px-4 py-1.5 rounded-lg text-sm font-semibold disabled:opacity-40" style={{ backgroundColor: COLORS.accent, color: COLORS.white }}>Save</button>
              </div>
            </div>
            <div className="p-5">
              <Field label="Section" required><SectionPicker value={form.section} onChange={(v) => setF('section', v)} /></Field>
              <Field label="BillNo" required><input value={form.billNo} onChange={(e) => setF('billNo', e.target.value)} placeholder="e.g. 255" className="w-full px-3 py-2 rounded-lg text-sm" style={inputStyle} /></Field>
              <Field label="BillDate"><input type="date" value={form.billDate} onChange={(e) => setF('billDate', e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm" style={inputStyle} /></Field>
              <Field label="Purchaser">
                <SearchableSelect value={form.purchaser} onChange={(v) => setF('purchaser', v)} options={purchasersList} />
              </Field>
              <Field label="Total Qty"><input type="number" min="0" value={form.totalQty} onChange={(e) => setF('totalQty', e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle} /></Field>
              <Field label="BillAmount (Excluding Tax)"><input type="number" min="0" value={form.billAmountExcl} onChange={(e) => setF('billAmountExcl', e.target.value)} placeholder="0.00" className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle} /></Field>
              <Field label="BillAmount (Including Tax)"><input type="number" min="0" value={form.billAmountIncl} onChange={(e) => setF('billAmountIncl', e.target.value)} placeholder="0.00" className="w-full px-3 py-2 rounded-lg text-sm sp-mono" style={inputStyle} /></Field>
              <Field label="Article Code">
                <ArticlePicker value={form.articleCode} onChange={(v) => setF('articleCode', v)} options={articlesList} />
              </Field>
              <Field label="Vendor Name" required>
                <SearchableSelect value={form.vendorName} onChange={(v) => setF('vendorName', v)} options={VENDORS} />
              </Field>
              <Field label="Invoice Page1">
                <input ref={fileRef} type="file" accept="image/*" onChange={onPhotoChange} className="hidden" />
                <button onClick={() => fileRef.current?.click()} className="w-full h-24 rounded-lg flex items-center justify-center overflow-hidden" style={inputStyle}>
                  {form.photo ? <img src={form.photo} alt="Invoice page 1" className="h-full object-cover" /> : <Camera size={20} color={`${COLORS.ink}88`} />}
                </button>
              </Field>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div className="py-2.5 flex items-center justify-between text-sm">
      <span style={{ color: '#22221F99' }}>{label}</span>
      <span className="font-medium">{value || '—'}</span>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const rootEl = document.getElementById('root');
rootEl.innerHTML = '';
const root = createRoot(rootEl);
root.render(<App />);
</script>
</body>
</html>
